name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Backend tests create a throwaway database per test here; WPS_REQUIRE_DB makes a
      # missing database a failure instead of a skip.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      WPS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm run check
